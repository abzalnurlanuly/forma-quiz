name: forma-quiz
services:
  quiz:
    build: .
    image: forma-quiz:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:7272:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      DATA_DIR: /app/data
      APP_ORIGIN: ${APP_ORIGIN:-https://quiz.abzalnurlanuly.com}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      ALLOW_SETUP: "false"
      SEED_DEMO: "false"
      TRUST_CLOUDFLARE_IP: ${TRUST_CLOUDFLARE_IP:-false}
    volumes:
      - quiz-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  quiz-data:
